[project]
name = "shopkeeper-agent"
version = "0.1.0"
description = "基于 LangGraph + FastAPI 的电商 NL2SQL 智能问数 Agent，支持多轮对话与 SQL 自动修正"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.11",
    "cryptography>=48.0.0",
    "elasticsearch[async]>=8,<9",
    "fastapi>=0.136.1",
    "greenlet>=3.5.1",
    "jieba>=0.42.1",
    "langchain>=1.3.1",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.47.0",
]
